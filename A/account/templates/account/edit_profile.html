
{% extends 'base.html' %}

{% block title %}Edit Profile | Social{% endblock %}

{% block content %}

<!-- فرم ویرایش اطلاعات کاربر -->
<div class="form-container">
    <div class="form-card">
        <h2>Edit Profile</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary w-100">
                Save Changes
            </button>
        </form>
    </div>
</div>

{% endblock %}
