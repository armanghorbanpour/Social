{% if messages %}
  <div class="text-center">
    {% for msg in messages %}
      <div class="alert alert-{{ msg.tags }} alert-dismissible fade show d-inline-block text-start" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
