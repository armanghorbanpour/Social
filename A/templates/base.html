
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- عنوان هر صفحه از قالب فرزند گرفته می‌شود -->
    <title>{% block title %}Social{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- اتصال Bootstrap برای طراحی واکنش‌گرا -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- اتصال استایل اختصاصی پروژه -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- نوار اصلی سایت -->
    {% include 'inc/navbar.html' %}

    <!-- محتوای صفحات -->
    <main class="container main-container">

        <!-- نمایش پیام‌های موفقیت و خطا -->
        {% include 'inc/messages.html' %}

        {% block content %}{% endblock %}
    </main>

    <!-- فایل جاوااسکریپت Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- حذف خودکار پیام‌ها بعد از ۳ ثانیه -->
    <script>
        setTimeout(function () {
            const alerts = document.querySelectorAll('.alert');

            alerts.forEach(function (alert) {
                const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
                bsAlert.close();
            });
        }, 3000);
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
