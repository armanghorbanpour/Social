
{% extends 'base.html' %}

{% block title %}Create Post | Social{% endblock %}

{% block content %}

<!-- فرم ساخت پست جدید -->
<div class="form-container">
    <div class="form-card">
        <h2>Create a post</h2>
        <p>Share something with the community.</p>

        <form method="post" novalidate>
            {% csrf_token %}

            <!-- فیلدهای فرم Django -->
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary w-100">
                Publish Post
            </button>
        </form>
    </div>
</div>

{% endblock %}
